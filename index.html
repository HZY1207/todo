<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f0">
  <meta name="description" content="简约护眼待办事项，支持月历视图与数据导出导入">
  <title>Todo · 待办清单</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">待办</h1>
    <nav class="view-switch" role="tablist">
      <button class="view-btn active" data-view="list" role="tab">清单</button>
      <button class="view-btn" data-view="calendar" role="tab">月历</button>
    </nav>
    <button class="icon-btn" id="btn-settings" aria-label="设置">⚙</button>
  </header>

  <!-- 清单视图 -->
  <main id="view-list" class="view active">
    <form id="add-form" class="add-bar" autocomplete="off">
      <input id="add-input" type="text" placeholder="添加待办…" maxlength="100">
      <input id="add-date" type="date" aria-label="日期">
      <button type="submit" class="add-btn" aria-label="添加">＋</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">进行中</button>
      <button class="filter-btn" data-filter="done">已完成</button>
      <span class="counter" id="counter"></span>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p class="empty-hint" id="empty-hint" hidden>暂无待办，添加一条吧</p>
  </main>

  <!-- 月历视图 -->
  <main id="view-calendar" class="view">
    <div class="cal-head">
      <button class="cal-nav" data-offset="-1" aria-label="上一月">&lt;</button>
      <h2 class="cal-title" id="cal-title"></h2>
      <button class="cal-nav" data-offset="1" aria-label="下一月">&gt;</button>
    </div>
    <div class="cal-weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <section class="day-panel">
      <div class="day-panel-head">
        <h3 id="day-title"></h3>
        <button class="icon-btn" id="btn-today" title="回到今天">今天</button>
      </div>
      <form id="day-add-form" autocomplete="off">
        <input id="day-add-input" type="text" placeholder="为这一天添加待办…" maxlength="100">
        <button type="submit" class="add-btn">＋</button>
      </form>
      <ul id="day-list" class="todo-list"></ul>
      <p class="empty-hint" id="day-empty" hidden>这一天还没有待办</p>
    </section>
  </main>

  <!-- 设置面板 -->
  <div class="overlay" id="settings-overlay" hidden>
    <div class="sheet" role="dialog" aria-label="设置">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="icon-btn" data-close aria-label="关闭">✕</button>
      </div>

      <h3>主题</h3>
      <div class="theme-grid" id="theme-grid">
        <button class="theme-card" data-theme="green"><i style="--c:#4a7c59"></i>绿白</button>
        <button class="theme-card" data-theme="mono"><i style="--c:#3b3f46"></i>黑白</button>
        <button class="theme-card" data-theme="blue"><i style="--c:#3d6e91"></i>蓝白</button>
      </div>

      <h3>数据</h3>
      <div class="actions">
        <button class="btn" id="btn-export">导出数据</button>
        <button class="btn" id="btn-import">导入数据</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <button class="btn btn-danger" id="btn-clear">清空全部</button>
      </div>
      <p class="hint">导出后可通过微信 / 网盘等把 JSON 文件发到电脑，在电脑上打开本页并导入即可。</p>

      <p class="hint count-hint" id="stat-hint"></p>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
